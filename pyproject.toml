[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetbot-navigation"
version = "0.1.0"
description = "Sensor-driven Jetbot navigation with reinforcement learning"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
a2c = ["skrl==1.4.3", "stable-baselines3==2.7.0"]

[tool.setuptools.packages.find]
include = ["jetbot_navigation*"]
